<script>
(() => {
  window.addEventListener("load", function () {

    // Scroll active item into view
    let scrollElem = document.querySelector(".sidebar-nav__section-link.active");
    if (scrollElem) {
      scrollElem.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
    }

    // Restore open sections
    const openSections = JSON.parse(localStorage.getItem("openSections") || "[]");
    openSections.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.add("show");
    });

    // Save state on toggle click
    document.querySelectorAll(".toggle").forEach(btn => {
      btn.addEventListener("click", function () {
        const target = this.getAttribute("data-target")?.replace("#", "");
        if (!target) return;

        let openSections = JSON.parse(localStorage.getItem("openSections") || "[]");

        if (openSections.includes(target)) {
          openSections = openSections.filter(id => id !== target);
        } else {
          openSections.push(target);
        }

        localStorage.setItem("openSections", JSON.stringify(openSections));
      });
    });

  });
})();
</script>
